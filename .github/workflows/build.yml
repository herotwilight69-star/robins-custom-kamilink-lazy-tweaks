name: Build

on:
  push:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-android:
    name: Build Android (${{matrix.name}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang arm64-v8a
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{matrix.rust_target}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build native library
        run: cmake --build --preset ${{matrix.preset}} --target dusklight

      - name: Build bundled mods
        run: cmake --build --preset ${{matrix.preset}} --target dusklight_mods

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Sign release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-robin-')
        env:
          ANDROID_KEYSTORE_BASE64: ${{secrets.ANDROID_KEYSTORE_BASE64}}
          ANDROID_KEYSTORE_PASSWORD: ${{secrets.ANDROID_KEYSTORE_PASSWORD}}
          ANDROID_KEY_ALIAS: ${{secrets.ANDROID_KEY_ALIAS}}
          ANDROID_KEY_PASSWORD: ${{secrets.ANDROID_KEY_PASSWORD}}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub Actions secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub Actions secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub Actions secret ANDROID_KEY_PASSWORD}"
          keystore="$RUNNER_TEMP/android-release.p12"
          unsigned_apk="platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release-unsigned.apk"
          signed_apk="platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$signed_apk"
          rm -f "$keystore"

      - name: Stage artifacts
        run: |
          mkdir -p upload/sdk
          cp build/*/stub-android-*.so upload/sdk/
          apk="platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release-unsigned.apk"
          if [ -f "platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release.apk" ]; then
            apk="platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release.apk"
          fi
          cp "$apk" upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lazytweaks-${{env.APP_VERSION}}-android-${{matrix.artifact_arch}}
          path: upload/

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    defaults:
      run:
        working-directory: s

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-latest
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64
          # - name: Clang x86_64
          #   runner: windows-latest
          #   preset: clang
          #   msvc_arch: amd64
          #   vcpkg_arch: x64
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          path: s
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Create short workspace drive
        working-directory: s
        run: |
          subst W: "$env:GITHUB_WORKSPACE"

      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      # msvc-dev-cmd sets VCPKG_ROOT, set it back
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:${{matrix.vcpkg_arch}}-windows zstd:${{matrix.vcpkg_arch}}-windows

      - name: Configure CMake
        run: |
          Set-Location W:\s
          cmake --preset x-windows-ci-${{matrix.preset}}

      - name: Build
        run: |
          Set-Location W:\s
          cmake --build --preset x-windows-ci-${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lazytweaks-${{env.APP_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: |
            s/build/install/*.exe
            s/build/install/*.dll
            s/build/install/res/
            s/build/install/mods/
            s/build/install/debug.7z
            s/build/install/sdk/

  publish-release:
    name: Package and publish custom release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-robin-')
    needs:
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Package platform builds
        shell: bash
        env:
          RELEASE_TAG: ${{github.ref_name}}
        run: |
          set -euo pipefail
          mkdir release
          package_artifact() {
            local artifact="$1"
            local suffix="$2"
            local source="artifacts/${artifact}"
            local destination="${GITHUB_WORKSPACE}/release/Dusklight-${RELEASE_TAG}-${suffix}.zip"
            if [[ ! -d "${source}" ]]; then
              echo "Missing expected build artifact: ${artifact}" >&2
              exit 1
            fi
            (cd "${source}" && zip -qr "${destination}" .)
          }
          versioned="lazytweaks-${RELEASE_TAG}"
          cp "artifacts/${versioned}-android-arm64/app-arm64-v8a-release.apk" \
            "release/Dusklight-${RELEASE_TAG}-android-arm64.apk"
          package_artifact "${versioned}-win32-msvc-x86_64" "win32-x86_64"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{github.token}}
          RELEASE_TAG: ${{github.ref_name}}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Robin's Custom Kamilink Lazy Tweaks $RELEASE_TAG" \
              --prerelease \
              --notes "Custom Dusklight build with Robin's compatibility APIs and services. The Android APK is signed for direct installation; Windows updates are installed from the matching release package."
          fi
